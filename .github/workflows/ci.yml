name: Validate lab
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      controls:
        description: Run the 99-permutation research control as well
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check src scripts tests
      - run: python -m mypy
      - run: python -m pytest --cov=biolab --cov-report=term-missing --cov-report=xml
      - run: python scripts/check_repository.py
      - run: python scripts/check_notebook_curriculum.py
      - run: python scripts/check_snapshot.py
      - run: python scripts/check_learning_assets.py
      - run: python scripts/check_all_results.py
      - name: Run all offline projects
        run: python scripts/lab.py run all --offline
      - name: Run exhaustive offline GO control
        run: python scripts/run_controls.py --experiment enrichment
      - name: Preserve project logs and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-runs-${{ matrix.python-version }}
          path: results/runs/

  locked-environment:
    name: Locked dependency environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v10.1.0
        with:
          version: '0.12.9'
      - run: uv sync --locked --extra dev --extra research
      - run: uv run pytest --cov=biolab --cov-report=term-missing

  windows-offline:
    name: Windows offline projects
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: biolab list
      - run: biolab run all --offline

  integration:
    name: Downloaded data and notebook integration
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,research]'
      - run: python scripts/lab.py run all
      - run: python scripts/validate_notebooks.py
      - name: Full training-label permutation experiment
        if: inputs.controls == true
        run: python scripts/run_controls.py --experiment expression
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-runs
          path: results/runs/

  raw-workflow-smoke:
    name: Linux raw-read smoke workflows
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Conda for Bioconda tools
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: biolab-smoke
          python-version: '3.12'
          auto-activate: false
          conda-remove-defaults: true
          channels: conda-forge,bioconda
          channel-priority: strict
      - name: Install small-genome bioinformatics tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bwa samtools bcftools cutadapt subread
          conda install -y -c conda-forge -c bioconda star=2.7.11b
      - name: Check shell scripts
        run: bash -n workflows/variants.sh workflows/rnaseq.sh
      - name: Generate reproducible fixture
        run: python scripts/create_raw_fixture.py --output /tmp/biolab-raw/fixture
      - name: Run paired-read variant workflow on fixture
        env:
          SKIP_QC: '1'
          SKIP_MULTIQC: '1'
          THREADS: '2'
        run: |
          bash workflows/variants.sh /tmp/biolab-raw/fixture/reference.fa /tmp/biolab-raw/fixture/R1.fastq.gz /tmp/biolab-raw/fixture/R2.fastq.gz smoke /tmp/biolab-raw/variants 1
      - name: Run paired-read RNA workflow on fixture
        env:
          SKIP_QC: '1'
          SKIP_MULTIQC: '1'
          THREADS: '2'
          STAR_SA_INDEX_NBASES: '4'
          SJDB_OVERHANG: '100'
        run: |
          bash workflows/rnaseq.sh /tmp/biolab-raw/fixture/reference.fa /tmp/biolab-raw/fixture/genes.gtf /tmp/biolab-raw/fixture/R1.fastq.gz /tmp/biolab-raw/fixture/R2.fastq.gz smoke-rna /tmp/biolab-raw/rnaseq 0
          python scripts/validate_raw_fixture.py /tmp/biolab-raw
      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-workflow-smoke
          path: /tmp/biolab-raw
